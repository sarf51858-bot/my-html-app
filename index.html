<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golden Echo Music Player</title>
    <!-- آیکون‌ها -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- اسکریپت اصلی اندروید -->
    <script src="cordova.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* هدر برنامه */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #1e1e1e;
            border-bottom: 1px solid #2a2a2a;
        }

        .header h1 {
            font-size: 18px;
            color: #ffcc00;
        }

        .scan-btn {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        /* بخش کاور و افکت چرخشی */
        .player-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            background: radial-gradient(circle, #252525 0%, #121212 100%);
        }

        .cover-art {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid #ffcc00;
            background: #282828 url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/svgs/solid/music.svg') center/50% no-repeat;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
            animation: spin 12s linear infinite;
            animation-play-state: paused;
        }

        .cover-art.playing {
            animation-play-state: running;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .track-info {
            text-align: center;
            margin-top: 15px;
            width: 80%;
        }

        .track-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 13px;
            color: #a0a0a0;
            margin-top: 4px;
        }

        /* کنترل‌های پخش */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin: 15px 0;
        }

        .btn-control {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
        }

        .btn-play {
            width: 55px;
            height: 55px;
            background: #ffcc00;
            color: #121212;
            border-radius: 50%;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* نوار زمان */
        .progress-container {
            width: 85%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: #888;
        }

        .progress-bar {
            flex-grow: 1;
            accent-color: #ffcc00;
        }

        /* بخش افکت‌ها (اکو و بیس) */
        .fx-panel {
            background: #1a1a1a;
            padding: 12px 20px;
            margin: 10px 15px;
            border-radius: 12px;
            border: 1px solid #2d2d2d;
        }

        .fx-title {
            font-size: 12px;
            color: #ffcc00;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .fx-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .fx-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #ccc;
        }

        .fx-control input {
            width: 100%;
            accent-color: #ffcc00;
            margin-top: 5px;
        }

        /* لیست پخش آهنگ‌ها */
        .playlist-container {
            flex-grow: 1;
            background: #181818;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 15px;
            overflow-y: auto;
        }

        .playlist-header {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .song-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #222;
            border-radius: 8px;
            cursor: pointer;
        }

        .song-item:active {
            background: #252525;
        }

        .song-item.active {
            background: #2a2400;
        }

        .song-item.active .song-name {
            color: #ffcc00;
        }

        .song-icon {
            color: #ffcc00;
            margin-left: 12px;
        }

        .song-details {
            flex-grow: 1;
            overflow: hidden;
        }

        .song-name {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <!-- هدر -->
    <div class="header">
        <h1>موزیک پلیر اختصاصی</h1>
        <button class="scan-btn" onclick="triggerFilePicker()"><i class="fa-solid fa-folder-plus"></i> انتخاب آهنگ‌ها</button>
    </div>

    <!-- نمایشگر و کاور -->
    <div class="player-display">
        <div class="cover-art" id="coverArt"></div>
        <div class="track-info">
            <div class="track-title" id="trackTitle">آهنگی انتخاب نشده</div>
            <div class="track-artist" id="trackArtist">موزیک پلیر اکودار</div>
        </div>
    </div>

    <!-- نوار پیشرفت -->
    <div class="progress-container">
        <span id="currentTime">0:00</span>
        <input type="range" id="seekBar" class="progress-bar" value="0" min="0" step="1">
        <span id="duration">0:00</span>
    </div>

    <!-- دکمه‌های کنترل -->
    <div class="controls">
        <button class="btn-control" onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
        <button class="btn-control btn-play" id="playBtn" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>
        <button class="btn-control" onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>
    </div>

    <!-- تنظیمات اکو و زیر و بم صوتی -->
    <div class="fx-panel">
        <div class="fx-title">
            <span><i class="fa-solid fa-sliders"></i> تنظیمات اختصاصی صدا</span>
        </div>
        <div class="fx-grid">
            <div class="fx-control">
                <span>اکو (Echo)</span>
                <input type="range" id="echoVal" min="0" max="0.8" step="0.05" value="0.2">
            </div>
            <div class="fx-control">
                <span>بیس (Bass)</span>
                <input type="range" id="bassVal" min="-10" max="15" step="1" value="5">
            </div>
            <div class="fx-control">
                <span>زیر (Treble)</span>
                <input type="range" id="trebleVal" min="-10" max="15" step="1" value="2">
            </div>
        </div>
    </div>

    <!-- لیست پخش -->
    <div class="playlist-container">
        <div class="playlist-header">
            <span>لیست موزیک‌ها (<span id="songCount">0</span>)</span>
        </div>
        <div id="playlist"></div>
    </div>

    <!-- عنصر صوتی مخفی -->
    <audio id="audioElement" style="display:none;"></audio>
    <input type="file" id="fileInput" multiple accept="audio/*" style="display:none;">

    <script>
        let songs = [];
        let currentIndex = -1;
        let isPlaying = false;

        const audio = document.getElementById('audioElement');
        const playBtn = document.getElementById('playBtn');
        const coverArt = document.getElementById('coverArt');
        const trackTitle = document.getElementById('trackTitle');
        const seekBar = document.getElementById('seekBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');

        // --- تنظیمات موتور صوتی (Web Audio API) ---
        let audioCtx, source, echoDelay, echoFeedback, bassFilter, trebleFilter;

        function initAudioEngine() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            source = audioCtx.createMediaElementSource(audio);

            // فیلتر بیس
            bassFilter = audioCtx.createBiquadFilter();
            bassFilter.type = 'lowshelf';
            bassFilter.frequency.value = 200;

            // فیلتر زیر (Treble)
            trebleFilter = audioCtx.createBiquadFilter();
            trebleFilter.type = 'highshelf';
            trebleFilter.frequency.value = 3000;

            // افکت اکو
            echoDelay = audioCtx.createDelay();
            echoDelay.delayTime.value = 0.25; // میزان تاخیر اکو

            echoFeedback = audioCtx.createGain();
            echoFeedback.gain.value = 0.2; // قدرت اکو

            // مسیردهی صدا
            source.connect(bassFilter);
            bassFilter.connect(trebleFilter);
            
            // اتصال اکو
            trebleFilter.connect(echoDelay);
            echoDelay.connect(echoFeedback);
            echoFeedback.connect(echoDelay);

            // خروجی اصلی
            trebleFilter.connect(audioCtx.destination);
            echoDelay.connect(audioCtx.destination);
        }

        // اسلایدرهای افکت
        document.getElementById('echoVal').addEventListener('input', (e) => {
            if (echoFeedback) echoFeedback.gain.value = parseFloat(e.target.value);
        });
        document.getElementById('bassVal').addEventListener('input', (e) => {
            if (bassFilter) bassFilter.gain.value = parseFloat(e.target.value);
        });
        document.getElementById('trebleVal').addEventListener('input', (e) => {
            if (trebleFilter) trebleFilter.gain.value = parseFloat(e.target.value);
        });

        // --- اسکن اتوماتیک اندروید ---
        document.addEventListener('deviceready', () => {
            var permissions = window.cordova.plugins.permissions;
            permissions.requestPermission(permissions.READ_EXTERNAL_STORAGE, (status) => {
                if(status.hasPermission) scanDevice();
            });
        }, false);

        function scanDevice() {
            const dirs = [cordova.file.externalRootDirectory + 'Music/', cordova.file.externalRootDirectory + 'Download/'];
            dirs.forEach(dir => {
                window.resolveLocalFileSystemURL(dir, (dirEntry) => {
                    var reader = dirEntry.createReader();
                    reader.readEntries((entries) => {
                        entries.forEach(entry => {
                            if (entry.isFile && entry.name.endsWith('.mp3')) {
                                addSong(entry.name, entry.nativeURL);
                            }
                        });
                    });
                });
            });
        }

        // انتخاب دستی فایل
        function triggerFilePicker() {
            document.getElementById('fileInput').click();
        }

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const files = e.target.files;
            for (let file of files) {
                const url = URL.createObjectURL(file);
                addSong(file.name, url);
            }
        });

        function addSong(title, url) {
            songs.push({ title, url });
            document.getElementById('songCount').innerText = songs.length;
            renderPlaylist();
            if (currentIndex === -1) loadSong(0);
        }

        function renderPlaylist() {
            const pl = document.getElementById('playlist');
            pl.innerHTML = '';
            songs.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = `song-item ${index === currentIndex ? 'active' : ''}`;
                item.onclick = () => loadSong(index);
                item.innerHTML = `
                    <i class="fa-solid fa-music song-icon"></i>
                    <div class="song-details">
                        <div class="song-name">${song.title}</div>
                    </div>
                `;
                pl.appendChild(item);
            });
        }

        function loadSong(index) {
            if (index < 0 || index >= songs.length) return;
            currentIndex = index;
            audio.src = songs[currentIndex].url;
            trackTitle.innerText = songs[currentIndex].title;
            renderPlaylist();
            playSong();
        }

        function playSong() {
            initAudioEngine();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            audio.play();
            isPlaying = true;
            playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            coverArt.classList.add('playing');
        }

        function pauseSong() {
            audio.pause();
            isPlaying = false;
            playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            coverArt.classList.remove('playing');
        }

        function togglePlay() {
            if (currentIndex === -1 && songs.length > 0) loadSong(0);
            else if (isPlaying) pauseSong();
            else playSong();
        }

        function nextSong() { loadSong((currentIndex + 1) % songs.length); }
        function prevSong() { loadSong((currentIndex - 1 + songs.length) % songs.length); }

        // به‌روزرسانی نوار پیشرفت
        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration)) {
                seekBar.value = (audio.currentTime / audio.duration) * 100;
                currentTimeEl.innerText = formatTime(audio.currentTime);
                durationEl.innerText = formatTime(audio.duration);
            }
        });

        seekBar.addEventListener('input', () => {
            audio.currentTime = (seekBar.value / 100) * audio.duration;
        });

        audio.addEventListener('ended', nextSong);

        function formatTime(sec) {
            let m = Math.floor(sec / 60);
            let s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
