name: Build Android APK

on:
  workflow_dispatch: # امکان اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project and Build APK
        run: |
          cordova create myapp com.example.myapp "My App"
          cd myapp
          # حذف فایل‌های پیش‌فرض
          rm -rf www/*
          # کپی کردن فایل‌های شما به پروژه
          cp -r ../* www/ || true
          rm -rf www/myapp www/.github
          
          # اضافه کردن پلاگین‌های دسترسی به حافظه گوشی
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-android-permissions
          
          # اضافه کردن اندروید و خروجی گرفتن
          cordova platform add android
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
