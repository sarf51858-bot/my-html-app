name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Project and Add Plugins
        run: |
          cordova create myapp com.sarf.music "Music Player"
          cd myapp
          rm -rf www/*
          cp -r ../* www/ || true
          # نصب پلاگین‌های حیاتی برای دسترسی به حافظه
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-android-permissions
          cordova platform add android
          # تنظیم دسترسی در فایل مانیفست
          sed -i '/<\/manifest>/i <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' platforms/android/app/src/main/AndroidManifest.xml
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-Debug
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
